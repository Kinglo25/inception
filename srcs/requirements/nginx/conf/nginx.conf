# Nginx server configuration for HTTPS WordPress site

server {
    # Listen on port 443 with SSL enabled (for both IPv4 and IPv6)
    listen 443 ssl; 
    listen [::]:443 ssl; 

    # Server name matching the domain in the certificate
    server_name lomajeru.42.fr;  
    
    # SSL protocol configuration (only secure versions)
    ssl_protocols TLSv1.2 TLSv1.3; 
    
    # Paths to SSL certificate and private key files
    ssl_certificate /etc/nginx/ssl/cert.crt; 
    ssl_certificate_key /etc/nginx/ssl/cert.key;
    
    # Website root directory and default index files
    root /var/www/html;  
    index index.php index.html; 

    # Main location block for handling requests
    location / {
        # Try serving the requested URI directly, then as a directory,
        # and finally pass it to index.php with query parameters
        try_files $uri $uri/ /index.php$is_args$args;
    }
    
    # Location block for PHP files
    location ~ \.php$ {
        # Include FastCGI parameters
        include fastcgi_params;
        
        # Pass PHP requests to the WordPress container on port 9000
        fastcgi_pass wordpress:9000; 
        
        # Set default script to index.php
	fastcgi_index index.php;
        
        # Set the script filename parameter for PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

